# conf pour postgres avec docker compose
spring:
  application:
    name: taskboard
  datasource:
  jpa:
    hibernate:
      ddl-auto: none   # Important : Flyway gère le schéma
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: true
      path: /h2-console

flyway:
  enabled: true
#  locations: classpath:db/migXXXXration

logging:
  level:
    root: info