spring:
  application:
    name: taskboard
  datasource:
#    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    url: jdbc:postgresql://localhost:5432/mydatabase
#    driverClassName: org.h2.Driver
    driverClassName: org.postgresql.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none   # Important : Flyway gère le schéma
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: true
      path: /h2-console

flyway:
  enabled: true
#  locations: classpath:db/migXXXXration

logging:
  level:
    root: info
